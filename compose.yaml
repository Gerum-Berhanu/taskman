services:
  db:
    image: postgres:18.6
    container_name: taskman-db-c
    env_file:
      - env/.env.psql
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskman -d taskman"]
      interval: 5s # try every 5s
      timeout: 5s # if one check hangs >5s → treat as fail
      retries: 10 # need this many "consecutive" failures before status is unhealthy
      start_period: 10s # first 10s, failures don’t count toward “unhealthy” (boot grace)
    ports: # access point from outside container
      - "5432:5432"

  api:
    build: .
    image: taskman-api:v1
    container_name: taskman-api-c
    ports:
      - "8080:8000"
    env_file:
      - env/.env
      - env/.env.production
    environment:
      TASKMAN_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
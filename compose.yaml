services:
  db:
    image: postgres:18.6

    env_file:
      - ./env/env.compose/.env.staging

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    build: .

    image: taskman-api:v1

    ports:
      # Only this machine.
      # Change to "8080:8000" only if direct external access is intentional.
      - "127.0.0.1:8080:8000"

    env_file:
      - ./env/.env
      - ./env/.env.staging

    environment:
      TASKMAN_ENV: staging

    depends_on:
      db:
        condition: service_healthy
        restart: true # If db restarts, api is restarted too

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  pgdata:
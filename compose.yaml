name: taskman

services:
  api:
    build: .

    image: taskman-api:v1

    ports:
      # Only this machine.
      - "127.0.0.1:8080:8000"

    env_file:
      - ./env/.env
      - ./env/.env.staging

    environment:
      TASKMAN_ENV: staging
      # Overrides localhost from env/.env.staging for the Compose network.
      # POSTGRES_* / REDIS_* / RABBITMQ_* come from --env-file (see `just compose-staging`).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_CACHE_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      REDIS_RATE_LIMIT_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
      REDIS_REGISTRATION_URL: redis://${REDIS_HOST}:${REDIS_PORT}/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//

    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  db:
    image: postgres:18.6

    env_file:
      - ./env/env-compose/.env.staging

    volumes:
      - pg_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  redis:
    image: redis:8.6

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine

    # guest is localhost-only; user/pass from --env-file (env/env-compose).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  worker:
    build: .

    image: taskman-api:v1

    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]

    env_file:
      - ./env/.env
      - ./env/.env.staging

    environment:
      TASKMAN_ENV: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_CACHE_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      REDIS_RATE_LIMIT_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
      REDIS_REGISTRATION_URL: redis://${REDIS_HOST}:${REDIS_PORT}/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//

    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

volumes:
  pg_data:
  redis_data:

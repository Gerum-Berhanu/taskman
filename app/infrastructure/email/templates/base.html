<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>{% block title %}Taskman{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #eef1f4;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1c2430;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .outer {
      width: 100%;
      background: #eef1f4;
      padding: 32px 16px;
    }
    .shell {
      max-width: 560px;
      margin: 0 auto;
    }
    .brand {
      text-align: center;
      padding: 0 8px 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0f3d3e;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #dbe1e8;
      box-shadow: 0 8px 24px rgba(28, 36, 48, 0.06);
    }
    .accent {
      height: 4px;
      background: linear-gradient(90deg, #0f766e 0%, #2dd4bf 100%);
    }
    .body {
      padding: 32px 36px 28px;
    }
    h1 {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.3;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 14px;
      font-size: 15px;
      color: #334155;
    }
    p:last-child {
      margin-bottom: 0;
    }
    .lede {
      font-size: 16px;
      color: #1c2430;
    }
    .muted {
      color: #64748b;
      font-size: 14px;
    }
    .meta {
      margin-top: 22px;
      padding: 14px 16px;
      background: #f8fafb;
      border: 1px solid #e8edf2;
      border-radius: 8px;
      font-size: 13px;
      color: #475569;
    }
    .meta strong {
      color: #0f3d3e;
      font-weight: 600;
      word-break: break-all;
    }
    .divider {
      height: 1px;
      background: #e8edf2;
      margin: 24px 0 16px;
      border: 0;
    }
    .footer {
      text-align: center;
      padding: 20px 8px 0;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="shell">
      <div class="brand">Taskman</div>
      <div class="card">
        <div class="accent"></div>
        <div class="body">
          {% block content %}{% endblock %}
        </div>
      </div>
      <div class="footer">
        {% block footer %}Sent by Taskman · Please do not reply to this email{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>

# !override requires Docker Compose v2.24+

services:
  db:
    env_file:
      - ./env/env-compose/.env.production

    volumes: !override
      - pg_data_prod:/var/lib/postgresql

  redis:
    volumes: !override
      - redis_data_prod:/data

  api:
    ports: !override []

    env_file:
      - ./env/.env
      - ./env/.env.production
    
    environment:
      TASKMAN_ENV: production
      # Overrides localhost from env/.env.production for the Compose network.
      # POSTGRES_* / REDIS_* / RABBITMQ_* come from --env-file (see `just compose-prod`).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_CACHE_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      REDIS_RATE_LIMIT_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
      REDIS_REGISTRATION_URL: redis://${REDIS_HOST}:${REDIS_PORT}/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//

  worker:
    env_file: !override
      - ./env/.env
      - ./env/.env.production

    environment:
      TASKMAN_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_CACHE_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      REDIS_RATE_LIMIT_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
      REDIS_REGISTRATION_URL: redis://${REDIS_HOST}:${REDIS_PORT}/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//

  beat:
    env_file: !override
      - ./env/.env
      - ./env/.env.production

    environment:
      TASKMAN_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_CACHE_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      REDIS_RATE_LIMIT_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
      REDIS_REGISTRATION_URL: redis://${REDIS_HOST}:${REDIS_PORT}/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//

    volumes: !override
      - celerybeat_data_prod:/var/celery

volumes:
  pg_data_prod:
  redis_data_prod:
  celerybeat_data_prod:
